name: Temporary unpack v027
on:
  push:
    paths:
      - ".github/workflows/unpack-v027.yml"
permissions:
  contents: write
jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack v027
        run: |
          cat v027/part*.b64 | tr -d '\n\r\t ' | base64 -d | gzip -dc > _v027_source.html
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _v027_source.html
          git commit -m "chore: temporarily unpack v027 source" || exit 0
          git push
