name: Repack v027 UI update
on:
  push:
    paths:
      - ".github/workflows/repack-v027.yml"
permissions:
  contents: write
jobs:
  repack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repack
        run: |
          rm -f v027/part*.b64
          gzip -9 -c _v027_source.html | base64 -w0 | fold -w8000 | awk '{f=sprintf("v027/part%02d.b64", NR-1); printf "%s", $0 > f; close(f)}'
          rm -f _v027_source.html .github/workflows/unpack-v027.yml .github/workflows/repack-v027.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add mission animation and itinerary PDF export"
          git push
