name: Repack v027 map drag fix
on:
  push:
    paths:
      - ".github/workflows/repack-v027.yml"
permissions:
  contents: write
jobs:
  repack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repack
        run: |
          rm -f v027/part*.b64
          gzip -9 -c _v027_source.html | base64 -w0 | fold -w8000 | awk '{f=sprintf("v027/part%02d.b64", NR-1); printf "%s", $0 > f; close(f)}'
          rm -f _v027_source.html .github/workflows/unpack-v027.yml .github/workflows/repack-v027.yml
      - name: Update loader parts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          parts=sorted(Path("v027").glob("part*.b64"))
          arr=",".join(f'"v027/{x.name}"' for x in parts)
          import re
          s=re.sub(r'const paths=\[[^\]]*\];', f'const paths=[{arr}];', s, count=1)
          p.write_text(s,encoding="utf-8")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix map dragging after dice movement"
          git push
