name: Fix terminal bounce direction
on:
  push:
    paths:
      - ".github/workflows/fix-terminal-bounce.yml"
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repack v027
        run: |
          rm -f v027/part*.b64
          gzip -9 -c _v027_source.html | base64 -w0 | fold -w8000 | awk '{f=sprintf("v027/part%02d.b64", NR-1); printf "%s", $0 > f; close(f)}'
          rm -f _v027_source.html
          rm -f .github/workflows/unpack-v027.yml
          rm -f .github/workflows/fix-terminal-bounce.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix direction lock after terminal turnaround"
          git push
