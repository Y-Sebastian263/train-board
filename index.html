<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>名古屋→大阪 鉄道すごろく v0.27</title>
<style>
html,body{height:100%;margin:0;background:#0b1020;color:#fff;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif}#loading{height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}h1{margin:0 0 10px;font-size:clamp(26px,5vw,48px)}p{color:#cbd5e1}
</style>
</head>
<body>
<div id="loading"><div><h1>鉄道すごろく v0.27</h1><p>読み込み中…</p></div></div>
<script>
(async()=>{
  try{
    const stamp=Date.now();
    const paths=["v027/part00.b64","v027/part01.b64","v027/part02.b64","v027/part03.b64","v027/part04.b64","v027/part05.b64"];
    const parts=await Promise.all(paths.map(async p=>{const r=await fetch(`${p}?v=${stamp}`,{cache:"no-store"});if(!r.ok)throw new Error(`${p}: HTTP ${r.status}`);return (await r.text()).replace(/\s+/g,"");}));
    const raw=atob(parts.join(""));
    const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));
    if(!("DecompressionStream" in window))throw new Error("このブラウザはgzip展開に対応していません");
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(err){
    const safe=String(err).replace(/[&<>]/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[s]));
    document.getElementById("loading").innerHTML=`<div><h1>読み込みに失敗しました</h1><p>${safe}</p><p>ページを再読み込みしてください。</p></div>`;
    console.error(err);
  }
})();
</script>
</body>
</html>
